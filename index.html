<!doctype html>

<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CIISTEC Executive Business Portal</title>

    <meta name="description" content="Portal Comercial Ejecutivo CIISTEC" />
    <meta name="theme-color" content="#071018" />

    <link rel="preconnect" href="/" />
    <link rel="stylesheet" href="./css/variables.css" />
    <link rel="stylesheet" href="./css/base.css" />
    <link rel="stylesheet" href="./css/layouts.css" />
    <link rel="stylesheet" href="./css/components.css" />
    <link rel="stylesheet" href="./css/animations.css" />
    <link rel="stylesheet" href="./css/themes.css" />
  </head>

  <body>
    <!-- APP ROOT -->

    <div id="app">
      <!-- BACKGROUND ENGINE -->

      <div
        id="background-layer"
        class="background-layer bg-gradient-tech"
      ></div>

      <!-- VISUAL OVERLAYS -->

      <div class="grid-overlay"></div>
      <div class="noise-overlay"></div>
      <div class="ambient-light"></div>

      <!-- MAIN EXPERIENCE -->

      <main id="presentation-container" class="presentation-container">
        <section id="slide-container" class="slide"></section>
      </main>

      <!-- NAVIGATION -->

      <aside class="navigation-ui">
        <button
          id="prev-slide"
          class="nav-btn nav-prev"
          aria-label="Slide anterior"
        >
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M15 18L9 12L15 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>

        <button
          id="next-slide"
          class="nav-btn nav-next"
          aria-label="Siguiente slide"
        >
          <svg viewBox="0 0 24 24" fill="none">
            <path
              d="M9 18L15 12L9 6"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            />
          </svg>
        </button>
      </aside>

      <!-- FOOTER EXECUTIVE BAR -->

      <footer class="executive-footer">
        <div class="footer-left">
          <div class="brand-block">
            <span class="brand-label"> CIISTEC </span>

            <span class="brand-divider"></span>

            <span id="presentation-title" class="presentation-title">
              Executive Business Portal
            </span>
          </div>
        </div>

        <div class="footer-center">
          <div class="progress-wrapper">
            <div id="progress-bar" class="progress-bar"></div>
          </div>
        </div>

        <div class="footer-right">
          <div id="slide-counter" class="slide-counter">1 / 1</div>
        </div>
      </footer>

      <!-- LOADER -->

      <div id="loader" class="loader-screen">
        <div class="loader-content">
          <div class="loader-logo">CIISTEC</div>

          <div class="loader-line">
            <span></span>
          </div>

          <div class="loader-text">Cargando experiencia ejecutiva...</div>
        </div>
      </div>
    </div>

    <!-- TEMPLATE REGISTRY -->

    <template id="header-template">
      <section class="block block-header"></section>
    </template>

    <template id="cards-template">
      <section class="block block-cards"></section>
    </template>

    <template id="list-template">
      <section class="block block-list"></section>
    </template>

    <template id="text-template">
      <section class="block block-text"></section>
    </template>

    <template id="kpis-template">
      <section class="block block-kpis"></section>
    </template>

    <template id="comparison-template">
      <section class="block block-comparison"></section>
    </template>

    <template id="table-template">
      <section class="block block-table"></section>
    </template>

    <template id="timeline-template">
      <section class="block block-timeline"></section>
    </template>

    <template id="diagnostic-template">
      <section class="block block-diagnostic"></section>
    </template>

    <!-- APPLICATION -->

    <script type="module" src="./js/app.js"></script>
  </body>
</html>
